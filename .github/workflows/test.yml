# Runs the automated tests on the Node.js LTS versions.
# Node 22 is the oldest supported LTS (Maintenance until 2027-04-30; drop it then), Node 24 is
# Maintenance LTS, and Node 26 has been Active LTS since 2026-10-28.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: node --version
      - run: node --test
