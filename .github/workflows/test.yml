# Runs the automated tests on the Node.js LTS versions.
# Node 22 is the oldest supported LTS (Maintenance until 2027-04-30); Node 24 is Active LTS.
# Node 26 becomes LTS on 2026-10-28; add it here then.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: node --version
      - run: node --test
