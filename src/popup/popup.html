<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../shared/style.css">
<style>
  body { width: 320px; padding: 16px; }
  h1 { font-size: 18px; margin: 0 0 2px; }
  .sub { font-size: 12px; margin: 0 0 14px; }
  .durations { display: flex; gap: 6px; margin-bottom: 10px; }
  .durations button { flex: 1; }
  .durations button[aria-pressed="false"] { background: var(--white); color: var(--ink); }
  #start, #stop { width: 100%; }
  .clock { font: 700 46px/1 var(--code); text-align: center; margin: 6px 0 4px; letter-spacing: -1px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; font-size: 12px;
           background: var(--white); border: 2px solid var(--ink); border-radius: 6px; padding: 10px; margin: 14px 0; }
  .stats b { display: block; font-size: 18px; }
  details summary { cursor: pointer; font-size: 13px; font-weight: 600; }
  details textarea { height: 140px; margin: 8px 0; }
  .hidden { display: none; }
  #saved.error { display: block; margin-top: 6px; color: var(--redpen); }
  .note { font-size: 12px; line-height: 1.45; margin: 10px 0 0; padding: 6px 9px;
          background: var(--white); border: 2px solid var(--marker); border-radius: 6px; }
  .note label { display: flex; gap: 6px; align-items: center; margin-top: 4px; font-weight: 600; cursor: pointer; }
  .note input { margin: 0; accent-color: var(--ink); }
  button.link { padding: 0; border: 0; background: none; color: var(--ink); text-decoration: underline; }
  .footer { margin: 12px 0 0; font-size: 12px; text-align: right; }
</style></head>
<body>
  <h1>Focus Guard</h1>
  <p class="sub muted">AI chat sites are blocked while a session runs.</p>

  <section id="idle">
    <div class="durations" role="group" aria-label="Session length">
      <button data-min="25" aria-pressed="true">25 min</button>
      <button data-min="50" aria-pressed="false">50 min</button>
      <button data-min="90" aria-pressed="false">90 min</button>
    </div>
    <button id="start">Start coding session</button>
  </section>

  <section id="active" class="hidden">
    <div class="clock" id="clock">25:00</div>
    <p class="sub muted" style="text-align:center" id="passNote">Solve it yourself. You've got this.</p>
    <button id="stop" class="ghost">End session early</button>
  </section>

  <!-- Reminders sit below the session controls so they never push them down -->
  <div class="note" id="geminiNote" hidden>Chrome's built-in Gemini isn't blocked.
    <button class="link" id="openGemini">Turn it off</button>
    <label><input type="checkbox" id="geminiOff"> I turned off Gemini in Chrome</label></div>
  <p class="note" id="incognito" hidden>Incognito windows aren't blocked yet.
    <button class="link" id="openSettings">Allow Focus Guard in Incognito</button></p>

  <div class="stats">
    <div><b id="sSessions">0</b>sessions finished</div>
    <div><b id="sMinutes">0</b>focused minutes</div>
    <div><b id="sBlocked">0</b>AI visits blocked</div>
    <div><b id="sUnlocks">0</b>passes used</div>
  </div>

  <details>
    <summary>Blocked sites</summary>
    <textarea id="sites" aria-label="Blocked sites, one per line"></textarea>
    <button id="saveSites" class="ghost">Save sites</button>
    <span id="saved" class="muted" style="font-size:12px"></span>
  </details>
  <p class="footer"><button class="link" id="openChecklist">Setup checklist</button></p>
  <script src="../shared/sites.js"></script>
  <script src="../shared/setup.js"></script>
  <script src="popup.js"></script>
</body></html>
